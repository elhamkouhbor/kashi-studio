<!doctype html><html><head><meta charset="utf-8"><title>svgcanvas spike</title>
<style>body{margin:0}#c{width:900px;height:700px;position:relative;overflow:auto}</style></head>
<body><div id="c"></div><input id="text" style="width:0;height:0;opacity:0"/>
<script type="module">
import SvgCanvas from "@svgedit/svgcanvas";
const canvas = new SvgCanvas(document.getElementById("c"), {
  initFill: { color: "FFFFFF", opacity: 1 }, initStroke: { color: "000000", opacity: 1, width: 1 },
  text: { stroke_width: 0, font_size: 24, font_family: "serif" }, initOpacity: 1, dimensions: [400, 400], baseUnit: "px",
  gridSnapping: false, snappingStep: 10, showRulers: false, imgPath: "",
});
canvas.updateCanvas(900, 700);
window.canvas = canvas;
window.events = [];
for (const ev of ["selected", "changed", "zoomed"]) canvas.bind(ev, (_w, els) => window.events.push(ev + ":" + (els ? els.length : 0)));
</script></body></html>
